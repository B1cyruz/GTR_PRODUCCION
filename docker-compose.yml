version: '3.8'

services:
  # Base de Datos PostgreSQL Exclusiva
  postgres:
    image: postgres:16-alpine
    container_name: gtr_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gtr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtr_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-gtr_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gtr_user} -d ${POSTGRES_DB:-gtr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gtr_network

  # Backend FastAPI en Python
  backend:
    build: .
    container_name: gtr_backend
    restart: always
    environment:
      - PROJECT_NAME=GTR - Gestión Logística y Rutas
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-gtr_production_secret_key_change_me_in_prod_2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gtr_user}:${POSTGRES_PASSWORD:-gtr_secure_password_2026}@postgres:5432/${POSTGRES_DB:-gtr_db}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - gtr_network

  # Servidor Web & Proxy Reverso Nginx
  nginx:
    image: nginx:alpine
    container_name: gtr_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
    networks:
      - gtr_network

volumes:
  pgdata:
    name: gtr_postgres_data

networks:
  gtr_network:
    name: gtr_network
    driver: bridge
